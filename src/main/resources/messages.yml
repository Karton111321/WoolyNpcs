  - "  &#BBDEFB/{label} despawnall &#9CA3AF— Деспаунить всех NPC"
  - ''
  - "&#9CA3AF Удобство:"
  - ''
  - "  &#BBDEFB/{label} select &#BBDEFB[имя|clear] &#9CA3AF— Выбрать NPC (без имени — тот, на кого смотрите)"
  - "  &#BBDEFB/{label} menu &#BBDEFB<list|reload|open> [id] &#9CA3AF— Меню из папки menus/"
  - "  &#BBDEFB/{label} backup &#9CA3AF— Резервная копия npcs.yml в backups/"
