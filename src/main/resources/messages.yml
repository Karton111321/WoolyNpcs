# ╔══════════════════════════════════════════════════════════════╗
# ║             WoolyNpcs  —  messages.yml                      ║
# ║    Все тексты и сообщения плагина. Настройки → config.yml   ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Цвета: используйте &0-&f (стандартные) или &#RRGGBB (hex).
# Плейсхолдеры: %prefix% заменяется на префикс (см. ниже),
#               {ключ}   — конкретное значение (имя NPC и т.д.)
# После изменений: /wnpc reload

# ──────────────────────────────────────────────────────────────
# ПРЕФИКС
# Вставляется вместо %prefix% во всех сообщениях.
# ──────────────────────────────────────────────────────────────
prefix: "&#374151[&#BBDEFB&lWoolyNpcs&#374151] &#9CA3AF» &#F5F5F0"

# ──────────────────────────────────────────────────────────────
# ОШИБКИ
# ──────────────────────────────────────────────────────────────
no-permission: "%prefix%&#FF8B94У вас нет прав на эту команду."
only-players: "%prefix%&#FF8B94Эту команду могут использовать только игроки."
npc-not-found: "%prefix%&#FF8B94NPC с именем '&#FFCDD2{name}&#FF8B94' не найден."
npc-exists: "%prefix%&#FF8B94NPC с таким именем уже существует. Выберите другое."
invalid-number: "%prefix%&#FF8B94Ошибка! Введите корректное число (например: 2.5)."
index-out-of-range: "%prefix%&#FF8B94Индекс &#FFCDD2{index}&#FF8B94 выходит за пределы списка (0–{max})."

# Имя NPC и имя файла экспорта: только латиница, цифры, дефис и подчёркивание.
invalid-name: "%prefix%&#FF8B94Недопустимое имя. Разрешены латиница, цифры, &#FFCDD2-&#FF8B94 и &#FFCDD2_&#FF8B94 (до 32 символов)."

# Сообщение при передаче недопустимого значения enum.
# {values} — список допустимых значений.
invalid-enum: "%prefix%&#FF8B94Недопустимое значение. Допустимые: &#FFCDD2{values}"

# ──────────────────────────────────────────────────────────────
# УПРАВЛЕНИЕ NPC
# ──────────────────────────────────────────────────────────────
npc-created: "%prefix%&#A8E6CFNPC '&#F5F5F0{name}&#A8E6CF' с моделью '&#F5F5F0{model}&#A8E6CF' успешно создан!"
npc-removed: "%prefix%&#A8E6CFNPC '&#F5F5F0{name}&#A8E6CF' удален."
npc-copied: "%prefix%&#A8E6CFNPC '&#F5F5F0{source}&#A8E6CF' скопирован как '&#F5F5F0{name}&#A8E6CF'."
npc-renamed: "%prefix%&#A8E6CFNPC '&#F5F5F0{old}&#A8E6CF' переименован в '&#F5F5F0{name}&#A8E6CF'."
npc-moved: "%prefix%&#A8E6CFNPC '&#F5F5F0{name}&#A8E6CF' перемещен на вашу позицию."
npc-teleported: "%prefix%&#A8E6CFВы телепортированы к NPC '&#F5F5F0{name}&#A8E6CF'."
npc-model-changed: "%prefix%&#A8E6CFМодель NPC '&#F5F5F0{name}&#A8E6CF' изменена на '&#F5F5F0{model}&#A8E6CF'."
npc-turned: "%prefix%&#A8E6CFNPC '&#F5F5F0{name}&#A8E6CF' повернут. Новый угол сохранен."
npc-anim-started: "%prefix%&#A8E6CFАнимация '&#F5F5F0{anim}&#A8E6CF' запущена для NPC '&#F5F5F0{name}&#A8E6CF'."

# Ручной spawn/despawn
npc-spawned: "%prefix%&#A8E6CFNPC '&#F5F5F0{name}&#A8E6CF' заспаунен."
npc-despawned: "%prefix%&#A8E6CFNPC '&#F5F5F0{name}&#A8E6CF' деспаунен."
npc-already-spawned: "%prefix%&#FF8B94NPC '&#FFCDD2{name}&#FF8B94' уже заспаунен."
npc-already-despawned: "%prefix%&#FF8B94NPC '&#FFCDD2{name}&#FF8B94' уже деспаунен."
npc-spawn-blocked: "%prefix%&#FF8B94NPC '&#FFCDD2{name}&#FF8B94' не поднят: {reason}"
spawn-block-manual: "&#9CA3AFон выключен вручную (&#F5F5F0/wnpc spawn&#9CA3AF снимет флаг)."
spawn-block-world: "&#9CA3AFмир NPC не загружен."
spawn-block-chunk: "&#9CA3AFчанк с NPC не загружен."
spawn-block-schedule: "&#9CA3AFсейчас не его время по расписанию."
spawn-block-visibility: "&#9CA3AFрядом нет игроков (задана дальность видимости)."
spawn-block-unknown: "&#9CA3AFпричина неизвестна."

# ──────────────────────────────────────────────────────────────
# СЛЕЖЕНИЕ ЗА ИГРОКОМ (lookat)
# ──────────────────────────────────────────────────────────────
npc-lookat-enabled: "%prefix%&#A8E6CFСлежение за игроком для '&#F5F5F0{name}&#A8E6CF': &#BBDEFB{status}"
npc-lookat-distance: "%prefix%&#A8E6CFДистанция слежения для '&#F5F5F0{name}&#A8E6CF': &#BBDEFB{value} блоков"
npc-lookat-smooth: "%prefix%&#A8E6CFПлавный поворот тела для '&#F5F5F0{name}&#A8E6CF': &#BBDEFB{value}"
npc-eyeheight-changed: "%prefix%&#A8E6CFВысота глаз для '&#F5F5F0{name}&#A8E6CF': &#BBDEFB{value} блоков"

# ──────────────────────────────────────────────────────────────
# ГОЛОГРАММА
# ──────────────────────────────────────────────────────────────
hologram-updated: "%prefix%&#A8E6CFГолограмма NPC '&#F5F5F0{name}&#A8E6CF' обновлена."

# ──────────────────────────────────────────────────────────────
# ДЕЙСТВИЯ (actions)
# ──────────────────────────────────────────────────────────────
action-added: "%prefix%&#A8E6CFДействие добавлено к NPC '&#F5F5F0{name}&#A8E6CF'."
action-removed: "%prefix%&#A8E6CFДействие #{index} удалено из NPC '&#F5F5F0{name}&#A8E6CF'."
action-cleared: "%prefix%&#A8E6CFВсе действия NPC '&#F5F5F0{name}&#A8E6CF' очищены."
action-no-money: "%prefix%&#FF8B94Недостаточно средств. Нужно: &#FFCDD2{amount}"
action-no-exp: "%prefix%&#FF8B94Недостаточно опыта. Нужен уровень: &#FFCDD2{amount}"

# Если у NPC нет ни одного действия при /wnpc action <n> list
action-list-empty: "%prefix%&#9CA3AFУ NPC '&#F5F5F0{name}&#9CA3AF' нет ни одного действия."

# Заголовок списка действий
action-list-header: "&#374151 ═══ &#BBDEFB&lДействия&#374151: &#F5F5F0{name} &#374151═══"

# Формат каждой строки в списке действий.
# {index} — порядковый номер (начиная с 0)
# {click} — тип клика (RIGHT_CLICK, LEFT_CLICK и т.д.)
# {type}  — тип действия (MESSAGE, PLAYER_COMMAND, CONSOLE_COMMAND и т.д.)
# {flags} — активные флаги ([PERM:...] [CD:...] [ONCE])
# {value} — значение (команда или сообщение)
action-list-format: "  &#374151[&#BBDEFB{index}&#374151] &#9CA3AF{click} &#374151→ &#F5F5F0{type}&#374151: &#BBDEFB{flags}{value}"

# Если у игрока нет нужного права для выполнения условного действия.
# Оставьте пустым (""), чтобы ничего не показывать.
action-no-permission: ""

# ──────────────────────────────────────────────────────────────
# ВИДИМОСТЬ И БЛИЗОСТЬ
# ──────────────────────────────────────────────────────────────
npc-visibility-changed: "%prefix%&#A8E6CFДальность видимости NPC '&#F5F5F0{name}&#A8E6CF': &#BBDEFB{value} &#9CA3AF(0 = только по чанкам)"
npc-proximity-changed: "%prefix%&#A8E6CFДальность триггера NPC '&#F5F5F0{name}&#A8E6CF': &#BBDEFB{value} блоков"

# ──────────────────────────────────────────────────────────────
# СПИСОК NPC (/wnpc list)
# ──────────────────────────────────────────────────────────────
list-header: "&#374151 ═══ &#BBDEFB&lСписок NPC &#374151═══"
list-empty: "%prefix%&#9CA3AFNPCов пока нет. Создайте первого: /wnpc create <имя> <модель>"

# {name}    — имя NPC
# {model}   — ID модели
# {spawned} — статус спауна (значения ниже: spawned-yes / spawned-no)
list-format: "  &#374151- &#BBDEFB{name} &#9CA3AF[{model}] {spawned}"

# Иконки статуса спауна в списке
spawned-yes: "&#A8E6CF✔"
spawned-no: "&#FF8B94✘"

# ──────────────────────────────────────────────────────────────
# ИНФОРМАЦИЯ (/wnpc info)
# ──────────────────────────────────────────────────────────────
info-header: "&#374151 ═══ &#BBDEFB&l{name} &#374151═══"
info-model: "  &#9CA3AFМодель&#374151: &#BBDEFB{model}"
info-location: "  &#9CA3AFПозиция&#374151: &#BBDEFB{world} &#F5F5F0{x}  {y}  {z}"
info-rotation: "  &#9CA3AFПоворот&#374151: &#BBDEFB{yaw}°  {pitch}°"
info-anim: "  &#9CA3AFАнимация&#374151: &#BBDEFB{anim}"
info-lookat: "  &#9CA3AFСлежение&#374151: &#BBDEFB{status} &#9CA3AF(дист: {distance}  глаза: {eyeheight})"
info-holo: "  &#9CA3AFГолограмма&#374151: &#BBDEFB{count} &#9CA3AFстрок"
info-actions: "  &#9CA3AFДействий&#374151: &#BBDEFB{count}"
info-visibility: "  &#9CA3AFВидимость&#374151: &#BBDEFB{range} &#9CA3AF({mode})"
info-spawned: "  &#9CA3AFСпаун&#374151: &#BBDEFB{status}"
info-stats: "  &#9CA3AFВзаимодействий&#374151: &#BBDEFB{clicks}"

# Значения для {mode} в info-visibility
info-vis-chunk: "по чанку"
info-vis-range: "по дальности"

# Значения для {status} (boolean) — вместо true/false
bool-true:  "&#A8E6CFвкл"
bool-false: "&#FF8B94выкл"

# ──────────────────────────────────────────────────────────────
# СТАТИСТИКА
# ──────────────────────────────────────────────────────────────
stats-header: "&#374151 ═══ &#BBDEFB&lСтатистика&#374151: &#F5F5F0{name} &#374151═══"
stats-total: "  &#9CA3AFВсего кликов&#374151: &#BBDEFB{clicks}"
stats-reset: "%prefix%&#A8E6CFСтатистика NPC '&#F5F5F0{name}&#A8E6CF' сброшена."

# ──────────────────────────────────────────────────────────────
# ПРОЧЕЕ
# ──────────────────────────────────────────────────────────────
reload-success: "%prefix%&#A8E6CFКонфигурация и сообщения перезагружены."
command-blocked: "%prefix%&#FF8B94Эта команда заблокирована для действий NPC."
cooldown-message: "%prefix%&#FF8B94Подождите &#FFCDD2{time} сек&#FF8B94 перед следующим кликом."

# ──────────────────────────────────────────────────────────────
# СПРАВКА (/wnpc help)
# {label} заменяется на алиас команды (wnpc или woolynpcs)
# ──────────────────────────────────────────────────────────────
help-header: "&#374151 ═══ &#BBDEFB&lWoolyNpcs &#9CA3AF— Справка &#374151═══"
help-lines:
  - ''
  - "&#9CA3AF Управление NPC:"
