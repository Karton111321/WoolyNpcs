# ──────────────────────────────────────────────────────────────
# ИСПОЛЬЗОВАНИЕ КОМАНД (usage)
# Все строки «использование: ...» вынесены сюда.
# Показываются при неверном вводе команды.
# {label} заменяется на алиас (/wnpc или /woolynpcs).
# ──────────────────────────────────────────────────────────────
invalid-usage: "%prefix%&#F5F5F0Использование: &#BBDEFB{usage}"
usage:
  create: "/{label} create <имя> <модель>"
  menu: "/{label} menu <list|reload|open> [id]"
  backup: "/{label} backup"
  search: "/{label} search <текст> [страница]"
  move: "/{label} move <имя> <none|follow|wander> [радиус] [скорость]"
  routine: "/{label} routine <имя> <add|list|remove|clear> [время] [тип] [значение]"
  remove: "/{label} remove <имя>"
  copy: "/{label} copy <источник> <новое_имя>"
  rename: "/{label} rename <имя> <новое_имя>"
  info: "/{label} info <имя>"
  edit: "/{label} edit <имя>"
  movehere: "/{label} movehere <имя>"
  tpto: "/{label} tpto <имя>"
  model: "/{label} model <имя> <модель>"
  turn: "/{label} turn <имя>"
  anim: "/{label} anim <имя> <анимация|none>"
  visibility: "/{label} visibility <имя> <дистанция|0>"
  proximity: "/{label} proximity <имя> <дистанция>"
  spawn: "/{label} spawn <имя>"
  despawn: "/{label} despawn <имя>"
  stats: "/{label} stats <имя> [reset]"

  lookat: "/{label} lookat <имя> <enable|distance|smooth|eyeheight>"
  lookat-enable: "/{label} lookat <имя> enable <true|false>"
  lookat-distance: "/{label} lookat <имя> distance <число>"
  lookat-smooth: "/{label} lookat <имя> smooth <true|false>"
  lookat-eyeheight: "/{label} lookat <имя> eyeheight <число>"

  holo: "/{label} holo <имя> <line | offset | scale | shadow | background | bg-alpha | billboard | align | see-through | line-width | view-range>"
  holo-line: "/{label} holo <имя> line <add | set | remove | clear | list>"
  holo-line-add: "/{label} holo <имя> line add <текст>"
  holo-line-set: "/{label} holo <имя> line set <индекс> <текст>"
  holo-line-remove: "/{label} holo <имя> line remove <индекс>"
  holo-offset: "/{label} holo <имя> offset <число>"
  holo-scale: "/{label} holo <имя> scale <число>"
  holo-shadow: "/{label} holo <имя> shadow <true | false>"
  holo-background: "/{label} holo <имя> background <true | false>"
  holo-bg-alpha: "/{label} holo <имя> bg-alpha <0-255>"
  holo-billboard: "/{label} holo <имя> billboard <CENTER | VERTICAL | HORIZONTAL | FIXED>"
  holo-align: "/{label} holo <имя> align <LEFT | CENTER | RIGHT>"
  holo-see-through: "/{label} holo <имя> see-through <true | false>"
  holo-line-width: "/{label} holo <имя> line-width <пикселей>"
  holo-view-range: "/{label} holo <имя> view-range <блоков>"

  action: "/{label} action <имя> <add | remove | clear | list>"
  action-add: "/{label} action <имя> add <ТИП_КЛИКА> <ТИП_ДЕЙСТВИЯ> <значение>"
  action-remove: "/{label} action <имя> remove <индекс>"

  dialog: "/{label} dialog <имя> <set | remove | list | reload>"
  waypoint: "/{label} waypoint <имя> <add | remove | clear | list | speed | loop>"
  schedule: "/{label} schedule <имя> <set | remove | info>"
  clickreward: "/{label} clickreward <имя> <set | remove | info>"
  playerhide: "/{label} playerhide <имя_NPC> <игрок>"
  playershow: "/{label} playershow <имя_NPC> <игрок>"
  export: "/{label} export <имя>"
  import: "/{label} import <новое_имя> <файл>"
  permission: "/{label} permission <имя> <set | remove | info>"

# Подсказки для action add — показываются после ошибочного ввода
action-add-hint-clicks: "&#9CA3AF  Типы клика: &#BBDEFBRIGHT_CLICK LEFT_CLICK SHIFT_RIGHT_CLICK SHIFT_LEFT_CLICK ANY ON_ENTER ON_LEAVE"
action-add-hint-types: "&#9CA3AF  Типы действия: &#BBDEFBCONSOLE_COMMAND PLAYER_COMMAND MESSAGE SERVER SOUND TELEPORT TITLE ACTIONBAR PARTICLE EFFECT GIVE_ITEM FIREWORK BOSSBAR"
action-add-hint-flags: "&#9CA3AF  Флаги: &#BBDEFB[PERM:право] [CD:сек] [DELAY:сек] [MONEY:сумма] [EXP:уровни] [ONCE] [WORLD:мир] [TIME:DAY|NIGHT] [WEATHER:CLEAR|RAIN|THUNDER]"

# ──────────────────────────────────────────────────────────────
# ПОДСКАЗКИ К ГОЛОГРАММЕ (/wnpc holo ... list)
# Показываются при /wnpc holo <имя> line list
# ──────────────────────────────────────────────────────────────
# {index} — номер строки, {text} — текст строки

# ──────────────────────────────────────────────────────────────
# ИНТЕРАКТИВНЫЙ РЕДАКТОР В ЧАТЕ
# ──────────────────────────────────────────────────────────────
holo-editor-header: "\n&#374151 ═══ &#BBDEFB&lГолограмма: &#F5F5F0{name} &#374151═══"
