# ╔══════════════════════════════════════════════════════════════╗
# ║              WoolyNpcs  —  config.yml                       ║
# ║         Настройки плагина. Тексты → messages.yml            ║
# ╚══════════════════════════════════════════════════════════════╝

settings:

  # ──────────────────────────────────────────────────────────────
  # ЗАДЕРЖКА ЗАПУСКА
  # ──────────────────────────────────────────────────────────────
  # Сколько тиков подождать после старта сервера, прежде чем
  # загружать NPC. 20 тиков = 1 секунда.
  # Увеличьте это значение, если NPC не появляются при старте
  # (например на медленных серверах или с большим числом плагинов).
  # [20]
  startup-delay-ticks: 20

  # Какую анимацию проигрывать, когда игрок подходит к NPC? (ON_ENTER)
  proximity-animation: "wave"

  # ──────────────────────────────────────────────────────────────
  # КУЛДАУН КЛИКОВ
  # ──────────────────────────────────────────────────────────────
  # Сколько секунд игрок должен ждать между кликами по одному NPC.
  # Кулдаун работает отдельно для каждого NPC (нажатие на NPC_A
  # не блокирует NPC_B). [2]
  interaction-cooldown-seconds: 2

  # Скрыть сообщение «подождите X сек» во время кулдауна?
  # true = сообщение не показывается, false = показывается. [false]
  disable-cooldown-message: false

  # ──────────────────────────────────────────────────────────────
  # ЗВУК ВЗАИМОДЕЙСТВИЯ
  # ──────────────────────────────────────────────────────────────
  # Звук, который проигрывается игроку при клике на NPC.
  # Оставьте пустым (""), чтобы отключить.
  # Примеры: UI_BUTTON_CLICK, ENTITY_EXPERIENCE_ORB_PICKUP
  interaction-sound: ""
  interaction-sound-volume: 0.5
  interaction-sound-pitch: 1.0

  # ──────────────────────────────────────────────────────────────
  # АВТОСОХРАНЕНИЕ
  # ──────────────────────────────────────────────────────────────
  # Автоматически сохранять данные NPC каждые N минут?
  # NPC всегда сохраняются при выключении сервера. [true]
  autosave-enabled: true

  # Интервал автосохранения в минутах. [15]
  autosave-interval-minutes: 15

  # Как часто сбрасывать на диск изменения, сделанные командами (в тиках).
  # Команды не пишут файл сразу — они помечают данные изменёнными, а запись
  # идёт пачкой в фоне. Меньше → надёжнее, больше → меньше обращений к диску.
  # Минимум 20 тиков (1 секунда). [100]
  save-flush-interval-ticks: 100

  # ──────────────────────────────────────────────────────────────
  # СЛЕЖЕНИЕ ЗА ИГРОКОМ (поворот головы)
  # ──────────────────────────────────────────────────────────────
  # Как часто обновлять угол поворота головы NPC к игроку (в тиках).
  # 2 = очень плавно, 10 = заметные рывки, 20 = раз в секунду.
  # Меньше → плавнее, но выше нагрузка на сервер. [2]
  look-update-interval-ticks: 2

  # Возвращать NPC в исходное положение, если игрок ушёл?
  # true = да, false = NPC остаётся в последнем положении. [true]
  look-reset-direction: true

  # Максимальный угол наклона головы вверх/вниз (в градусах).
  # Нужен, чтобы избежать неестественных поворотов шеи.
  # Диапазон: 0–90. [45.0]
  look-pitch-clamp: 45.0

  # ──────────────────────────────────────────────────────────────
  # ДАЛЬНОСТЬ ВИДИМОСТИ И ТРИГГЕРЫ БЛИЗОСТИ
  # ──────────────────────────────────────────────────────────────
  # Как часто проверять, есть ли игроки рядом с NPC (в тиках).
  # Используется для:
  #   • Спауна/деспауна NPC по дальности (если visibility-range > 0)
  #   • Триггеров ON_ENTER / ON_LEAVE в действиях NPC
  #   • Проверки расписания NPC
  # [10]
  proximity-update-interval-ticks: 10

  # Сколько NPC показывать на одной странице в /wnpc list, near и search. [8]
  list-page-size: 8

  # Сколько минут удалённый NPC хранится в корзине и может быть возвращён
  # командой /wnpc undo. 0 — не хранить, удаление сразу необратимо. [10]
  undo-minutes: 10

  # Как часто срабатывает триггер ON_TIME (в секундах) для игроков в радиусе.
  # Сам триггер о времени ничего не знает — нужное окно задаётся условиями
  # [REALTIME:09:00-18:00], [TIME:NIGHT], [WEEKDAY:SAT,SUN] и [CHANCE:]. [60]
  on-time-interval-seconds: 60

  # Запас к дальности видимости, при котором NPC ещё не деспаунится.
  # Нужен, чтобы игрок, стоящий ровно на границе радиуса, не заставлял NPC
  # мигать. Указывается в блоках. [2.0]
  visibility-range-hysteresis: 2.0

  # ──────────────────────────────────────────────────────────────
  # ДИАЛОГИ
  # ──────────────────────────────────────────────────────────────
  # Через сколько секунд бездействия диалог закрывается сам.
  # 0 = никогда не закрывать. [60]
  dialog-timeout-seconds: 60

  # На каком расстоянии от NPC игрок ещё может выбирать варианты ответа.
  # Защищает от выбора вариантов «на расстоянии» через команду.
  # 0 = без ограничения. [10.0]
  dialog-max-distance: 10.0

  # ──────────────────────────────────────────────────────────────
  # MODEL ENGINE
  # ──────────────────────────────────────────────────────────────
  # Сколько раз пытаться загрузить модель ModelEngine, если она
  # не найдена сразу (каждая попытка = 1 секунда ожидания).
  # После исчерпания попыток в консоль выводится предупреждение.
  # Увеличьте, если модели долго регистрируются при старте. [10]
  max-model-retries: 10

  # ──────────────────────────────────────────────────────────────
  # ЗАБЛОКИРОВАННЫЕ КОМАНДЫ
  # ──────────────────────────────────────────────────────────────
  # Команды, которые NPC не имеют права выполнять через действия.
  # Указывайте без слэша. Регистр не важен.
  blocked-commands:
    - op
    - ban
    - ban-ip
    - stop
    - reload
    - whitelist

  # ──────────────────────────────────────────────────────────────
  # ВЫБОР NPC ВЗГЛЯДОМ (/wnpc select и @ вместо имени)
  # ──────────────────────────────────────────────────────────────
  # На каком расстоянии искать NPC, на которого смотрит администратор. [12.0]
  selection-distance: 12.0

  # Половина угла конуса поиска в градусах. Меньше — точнее прицел,
  # больше — легче попасть по NPC. Диапазон 1–90. [20.0]
  selection-cone-angle: 20.0

  # ──────────────────────────────────────────────────────────────
  # ДВИЖЕНИЕ И РЕЛЬЕФ
  # ──────────────────────────────────────────────────────────────
  # Какую анимацию проигрывать во время ходьбы по маршруту.
  walk-animation: "walk"

  # На сколько блоков NPC может подняться, встретив ступеньку. [1]
  terrain-step-up: 1

  # На сколько блоков NPC может спрыгнуть вниз. [4]
  terrain-max-drop: 4

  # Как часто перерисовывать частицы маршрута (в тиках). [10]
  waypoint-visual-interval-ticks: 10

  # Расстояние между частицами на линии маршрута (в блоках). [0.5]
  waypoint-visual-step: 0.5

  # Через сколько тиков показ маршрута выключается сам. [2400]
  waypoint-visual-auto-stop-ticks: 2400

  # ──────────────────────────────────────────────────────────────
  # ОФОРМЛЕНИЕ ДЕЙСТВИЙ
  # ──────────────────────────────────────────────────────────────
  # Тайминги действия TITLE в тиках: появление, показ, исчезновение.
  title-fade-in-ticks: 10
  title-stay-ticks: 70
  title-fade-out-ticks: 20

  # Сколько секунд висит BOSSBAR, если длительность не указана в действии. [5]
  bossbar-default-seconds: 5

  # Таймаут запроса DISCORD_WEBHOOK в миллисекундах. [5000]
  webhook-timeout-ms: 5000

  # Максимальная длина сообщения в Discord. Ограничение самого Discord — 2000. [1900]
  webhook-max-length: 1900

  # ──────────────────────────────────────────────────────────────
  # ПРОЧЕЕ
  # ──────────────────────────────────────────────────────────────
  # Сколько удалённых NPC хранить в корзине для /wnpc undo. [10]
  undo-capacity: 10

  # На сколько шагов назад можно вернуться в диалоге через goto: back. [32]
  dialog-history-limit: 32

# ╔══════════════════════════════════════════════════════════════╗
# ║                    ХРАНИЛИЩЕ ДАННЫХ                          ║
# ╚══════════════════════════════════════════════════════════════╝

storage:

  # Где хранить персональные данные игроков: кулдауны [CD:], историю [ONCE],
  # флаги диалогов, скрытые NPC и личную статистику кликов.
  #
  #   yaml   — файл на игрока в папке playerdata/ (по умолчанию, ничего не требует)
  #   sqlite — один файл playerdata.db; нужен драйвер org.sqlite.JDBC
  #   mysql  — общая база для сети серверов; нужен драйвер MySQL
  #
  # Если выбран sqlite или mysql, но драйвера нет или подключиться не вышло,
  # плагин напишет об этом в лог и продолжит на yaml — данные не потеряются.
  type: yaml

  mysql:
    host: localhost
    port: 3306
    database: minecraft
    user: root
    password: ""

  # Как часто сбрасывать на диск изменённые данные игроков (в тиках).
  # Данные также сохраняются при выходе игрока и при выключении сервера.
  # Минимум 100 тиков (5 секунд). [600]
  player-flush-interval-ticks: 600

  # Сколько резервных копий npcs.yml хранить в папке backups/.
  # Копия делается перед обновлением формата данных и по /wnpc backup.
  # 0 — не делать копии. [3]
  backup-count: 3
