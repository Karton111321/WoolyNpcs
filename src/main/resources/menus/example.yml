# ╔══════════════════════════════════════════════════════════════╗
# ║              WoolyNpcs  —  menus/example.yml                 ║
# ║   Меню открывается действием OPEN_GUI <имя файла без .yml>   ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Скопируйте этот файл под другим именем — получится новое меню.
# Кнопки используют те же действия и условия, что и клики по NPC.

# Заголовок окна. Поддерживает {player} и цвета &#RRGGBB.
title: "&#BBDEFBПример меню"

# Размер: кратен 9, от 9 до 54.
size: 27

items:
  # Ключ — номер слота (0..размер-1). Верхний ряд это 0..8.
  '11':
    material: DIAMOND
    name: "&#A8E6CFПолучить алмаз"
    lore:
      - "&#9CA3AFОдин раз на игрока"
      - ""
      - "&#BBDEFB▸ Нажмите"
    # Закрывать меню после нажатия.
    close-on-click: true
    actions:
      - "GIVE_ITEM:[ONCE]DIAMOND 1"
      - "MESSAGE:&#A8E6CFДержите!"

  '13':
    material: GOLD_INGOT
    name: "&#A8E6CFКупить набор за 100"
    lore:
      - "&#9CA3AFНужно 100 монет"
    actions:
      - "MONEY_TAKE:100"
      - "PLAYER_COMMAND:kit starter"

  '15':
    material: BARRIER
    name: "&#FF8B94Закрыть"
    actions:
      - "CLOSE_INVENTORY:1"
